<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PixelReview</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-user-select: none; user-select: none; }
    html, body {
      height: 100%;
      background: #f8fafc;
      color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 0.4s ease-out;
    }
    .logo-badge {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 24px -4px rgba(79, 70, 229, 0.35);
      color: white;
      font-size: 34px;
      margin-bottom: 18px;
    }
    .app-title {
      font-size: 22px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }
    .app-subtitle {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 28px;
    }
    .spinner {
      width: 24px;
      height: 24px;
      border: 2.5px solid #e2e8f0;
      border-top-color: #4f46e5;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div class="splash-container">
    <div class="logo-badge">⭐</div>
    <div class="app-title">PixelReview</div>
    <div class="app-subtitle">GetYourGuide Partner Hub</div>
    <div class="spinner"></div>
  </div>

  <script>
    // Immediate redirect to live production cloud backend
    const targetUrl = 'https://review-app-seven-kappa.vercel.app';
    window.location.replace(targetUrl);
  </script>
</body>
</html>
