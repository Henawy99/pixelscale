name: mycut_customer
description: MyCut Customer App — AI hairstyle simulation and barber QR handoff.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  mycut_core:
    path: ../../packages/mycut_core
  mycut_cutspec:
    path: ../../packages/mycut_cutspec
  mycut_ui:
    path: ../../packages/mycut_ui
  qr_flutter: ^4.1.0
  riverpod_annotation: ^2.6.1
  supabase_flutter: ^2.8.0

dev_dependencies:
  build_runner: ^2.4.13
  custom_lint: ^0.7.0
  flutter_test:
    sdk: flutter
  riverpod_generator: ^2.6.3
  riverpod_lint: ^2.6.3
  very_good_analysis: ^6.0.0

flutter:
  uses-material-design: true
